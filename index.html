
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multi-Select Carb Counter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #212529; }
  #root { min-height: 100vh; }
  input[type="text"], input[type="number"] { font-family: inherit; outline: none; }
  input[type="text"]:focus, input[type="number"]:focus { border-color: #007AFF !important; }
  button { font-family: inherit; cursor: pointer; border: none; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #ced4da; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useState } = React;

const FOOD_DATABASE = {
  Cappuccino: { name: '☕ Cappuccino (Large Skimmed Milk - 473ml )', carbs: 12.8 },

  porridgeOats: { name: '🥣 Porridge Oats (Dry - 50g)', carbs: 30 },
  weetabix: { name: '🥣 Weetabix (2 Biscuits)', carbs: 26 },
  cornflakes: { name: '🥣 Cornflakes (30g Bowl)', carbs: 25 },
  muesli: { name: '🥣 Muesli (Swiss Style - 50g)', carbs: 33 },

  wholeBread: { name: '🍞 Wholemeal Bread (1 Slice)', carbs: 16 },
  whiteBread: { name: '🍞 White Bread (1 Slice)', carbs: 15 },
  toastieSlice: { name: '🍞 Thick Toastie Bread (1 Slice)', carbs: 22 },
  SourdoughBread: { name: '🍞 Sourdough Bread (1 Slice)', carbs: 22 },
  crumpet: { name: '🍞 Crumpet (1 Standard)', carbs: 20 },
  bagel: { name: '🍞 Plain Bagel (1 Whole)', carbs: 48 },

  sweetPotato: { name: '🥔 Sweet Potato (Baked - 100g)', carbs: 21 },
  whitePotato: { name: '🥔 White Potato (Baked - 100g)', carbs: 17 },

  chips: { name: '🥔 Oven Chips (Portion - 150g)', carbs: 40 },
  whiteRice: { name: '🍚 White Rice (Cooked - 100g)', carbs: 28 },
  pasta: { name: '🍝 White Pasta (Cooked - 100g)', carbs: 25 },
  bakedBeans: { name: '🥫 Heinz Baked Beans (Half Can)', carbs: 22 },

  banana: { name: '🍌 Banana (1 Medium)', carbs: 23 },
  apple: { name: '🍎 Apple (1 Medium)', carbs: 15 },
  pear: { name: '🍐 Pear (1 Medium)', carbs: 15 },
  orange: { name: '🍊 Orange (1 Medium)', carbs: 12 },

  carrot: { name: '🥕 Carrot (1 Medium)', carbs: 5 },
  broccoli: { name: '🥦 Broccoli (100g)', carbs: 7 },

  popcornPlain: { name: '🍿 Popcorn (Plain - 30g Bag)', carbs: 17 },
  popcornSweet: { name: '🍿 Popcorn (Sweet - 100g Bag)', carbs: 69 },
  walkersCrisps: { name: '🥔 Walkers Crisps (25g Bag)', carbs: 13 },
  pringles: { name: '🥔 Pringles (Portion - 30g)', carbs: 16 },
  digestive: { name: '🍪 Digestive Biscuit (1)', carbs: 9 },
  kitkat: { name: '🍫 KitKat (2 Finger Bar)', carbs: 13 },
  snickers: { name: '🍫 Snickers (Standard 48g)', carbs: 24 },
};

const MAX_CUSTOM_CARBS = 300;
const MAX_RATIO = 100;
const HIGH_DOSE_WARNING_UNITS = 20;
const MAX_CORRECTION_FACTOR = 250;
const BG_LIMITS = {
  mmol: { min: 2, max: 33, unitLabel: 'mmol/L' },
  mgdl: { min: 36, max: 600, unitLabel: 'mg/dL' }
};
const SETTINGS_STORAGE_KEY = 'carb-counter-settings-v1';
const CUSTOM_LIBRARY_STORAGE_KEY = 'carb-counter-custom-library-v1';
const HIDDEN_LIBRARY_ITEMS_STORAGE_KEY = 'carb-counter-hidden-library-items-v1';

const getCorrectionFactorHelpText = (bgUnit) =>
  bgUnit === 'mmol'
    ? 'Correction factor = how much 1 unit lowers your BG. Example: 2 mmol/L per 1 unit means 1 unit should lower BG by about 2 mmol/L.'
    : 'Correction factor = how much 1 unit lowers your BG. Example: 50 mg/dL per 1 unit means 1 unit should lower BG by about 50 mg/dL.';

const roundToStep = (value, step) => Math.round(value / step) * step;
const isValidRoundingStep = (value) => value === '0.5' || value === '1';
const isValidBgUnit = (value) => value === 'mmol' || value === 'mgdl';

// --- Simple storage helpers wrapping window.storage (falls back to in-memory if unavailable) ---
const memoryFallback = {};
async function storageGet(key) {
  try {
    if (window.storage && window.storage.get) {
      const result = await window.storage.get(key, false);
      return result ? result.value : null;
    }
  } catch (e) {
    return null; // key not found or storage error
  }
  return Object.prototype.hasOwnProperty.call(memoryFallback, key) ? memoryFallback[key] : null;
}
async function storageSet(key, value) {
  try {
    if (window.storage && window.storage.set) {
      await window.storage.set(key, value, false);
      return true;
    }
  } catch (e) {
    console.error('Storage error', e);
  }
  memoryFallback[key] = value;
  return true;
}

function App() {
  const [showMenu, setShowMenu] = useState(false);
  const [ratio, setRatio] = useState('');
  const [mealPlate, setMealPlate] = useState([]);
  const [history, setHistory] = useState([]);
  const [roundingStep, setRoundingStep] = useState('0.5');
  const [bgUnit, setBgUnit] = useState('mmol');
  const [currentBg, setCurrentBg] = useState('');
  const [targetBg, setTargetBg] = useState('');
  const [correctionFactor, setCorrectionFactor] = useState('');
  const [calculatedDose, setCalculatedDose] = useState(null);
  const [helpModalVisible, setHelpModalVisible] = useState(false);
  const [bgHelpVisible, setBgHelpVisible] = useState(false);
  const [customLibraryFoods, setCustomLibraryFoods] = useState([]);
  const [hiddenLibraryItemIds, setHiddenLibraryItemIds] = useState([]);
  const [newLibraryFoodName, setNewLibraryFoodName] = useState('');
  const [newLibraryFoodCarbs, setNewLibraryFoodCarbs] = useState('');
  const [loaded, setLoaded] = useState(false);

  const removeHistoryEntry = (id) => {
    setHistory((prev) => prev.filter((e) => e.id !== id));
  };

  const removeFoodFromLibrary = async (foodId, isCustomFood) => {
    const updatedHiddenList = Array.from(new Set([...hiddenLibraryItemIds, foodId]));
    setHiddenLibraryItemIds(updatedHiddenList);

    if (isCustomFood) {
      const updatedFoods = customLibraryFoods.filter((food) => food.id !== foodId);
      setCustomLibraryFoods(updatedFoods);
      try {
        await Promise.all([
          storageSet(CUSTOM_LIBRARY_STORAGE_KEY, JSON.stringify(updatedFoods)),
          storageSet(HIDDEN_LIBRARY_ITEMS_STORAGE_KEY, JSON.stringify(updatedHiddenList))
        ]);
      } catch (error) {
        console.error('Failed to remove saved custom food', error);
        alert('Could not remove that food from the library. Please try again.');
      }
      return;
    }

    try {
      await storageSet(HIDDEN_LIBRARY_ITEMS_STORAGE_KEY, JSON.stringify(updatedHiddenList));
    } catch (error) {
      console.error('Failed to hide library food', error);
      alert('Could not remove that food from the library. Please try again.');
    }
  };

  useEffect(() => {
    const loadSavedData = async () => {
      try {
        const [rawSettings, rawCustomLibrary, rawHiddenLibraryItems] = await Promise.all([
          storageGet(SETTINGS_STORAGE_KEY),
          storageGet(CUSTOM_LIBRARY_STORAGE_KEY),
          storageGet(HIDDEN_LIBRARY_ITEMS_STORAGE_KEY)
        ]);

        if (rawSettings) {
          const parsed = JSON.parse(rawSettings);
          if (typeof parsed.ratio === 'string') setRatio(parsed.ratio);
          if (typeof parsed.roundingStep === 'string' && isValidRoundingStep(parsed.roundingStep)) setRoundingStep(parsed.roundingStep);
          if (typeof parsed.bgUnit === 'string' && isValidBgUnit(parsed.bgUnit)) setBgUnit(parsed.bgUnit);
          if (typeof parsed.targetBg === 'string') setTargetBg(parsed.targetBg);
          if (typeof parsed.correctionFactor === 'string') setCorrectionFactor(parsed.correctionFactor);
        }

        if (rawCustomLibrary) {
          const parsedFoods = JSON.parse(rawCustomLibrary);
          if (Array.isArray(parsedFoods)) {
            const validFoods = parsedFoods.filter(
              (item) =>
                item &&
                typeof item.id === 'string' &&
                typeof item.name === 'string' &&
                typeof item.carbs === 'number' &&
                !Number.isNaN(item.carbs)
            );
            setCustomLibraryFoods(validFoods);
          }
        }

        if (rawHiddenLibraryItems) {
          const parsedHidden = JSON.parse(rawHiddenLibraryItems);
          if (Array.isArray(parsedHidden)) {
            const validHidden = parsedHidden.filter((item) => typeof item === 'string');
            setHiddenLibraryItemIds(validHidden);
          }
        }
      } catch (error) {
        console.error('Failed to load saved app data', error);
      } finally {
        setLoaded(true);
      }
    };

    loadSavedData();
  }, []);

  const addFoodToPlate = (foodItem) => {
    if (!foodItem) {
      alert('Please choose a food from the library.');
      return;
    }
    setMealPlate((prevPlate) => [...prevPlate, { id: Date.now().toString() + Math.random().toString(36).slice(2), name: foodItem.name, carbs: foodItem.carbs }]);
    setShowMenu(false);
  };

  const addFoodToLibrary = async () => {
    const trimmedName = newLibraryFoodName.trim();
    const carbsAmount = parseFloat(newLibraryFoodCarbs);

    if (trimmedName.length === 0) {
      alert('Please enter a food name.');
      return;
    }

    if (isNaN(carbsAmount) || carbsAmount <= 0 || carbsAmount > MAX_CUSTOM_CARBS) {
      alert(`Please enter carbs between 0 and ${MAX_CUSTOM_CARBS}g for the new food.`);
      return;
    }

    const allExistingNames = [
      ...Object.values(FOOD_DATABASE).map((food) => food.name.toLowerCase()),
      ...customLibraryFoods.map((food) => food.name.toLowerCase())
    ];

    if (allExistingNames.includes(trimmedName.toLowerCase())) {
      alert('That food name already exists in your library. Please use a different name.');
      return;
    }

    const newFood = {
      id: Date.now().toString() + Math.random().toString(36).slice(2),
      name: `🆕 ${trimmedName}`,
      carbs: carbsAmount
    };

    const updatedFoods = [...customLibraryFoods, newFood];

    try {
      await storageSet(CUSTOM_LIBRARY_STORAGE_KEY, JSON.stringify(updatedFoods));
      setCustomLibraryFoods(updatedFoods);
      setNewLibraryFoodName('');
      setNewLibraryFoodCarbs('');
      alert('New food added to your library.');
    } catch (error) {
      console.error('Failed to save custom library food', error);
      alert('Could not save the new food. Please try again.');
    }
  };

  const removeFoodFromPlate = (id) => {
    setMealPlate((prevPlate) => prevPlate.filter((item) => item.id !== id));
    setCalculatedDose(null);
  };

  const clearPlate = () => {
    setMealPlate([]);
    setCalculatedDose(null);
  };

  const savePersonalSettings = async () => {
    const parsedRatio = ratio === '' ? null : parseFloat(ratio);
    const parsedTargetBg = targetBg === '' ? null : parseFloat(targetBg);
    const parsedCorrectionFactor = correctionFactor === '' ? null : parseFloat(correctionFactor);
    const selectedLimits = BG_LIMITS[bgUnit];

    if (parsedRatio !== null && (isNaN(parsedRatio) || parsedRatio <= 0 || parsedRatio > MAX_RATIO)) {
      alert(`Please enter a valid Insulin-to-Carb Ratio between 1 and ${MAX_RATIO} before saving.`);
      return;
    }

    if (parsedTargetBg !== null && (isNaN(parsedTargetBg) || parsedTargetBg < selectedLimits.min || parsedTargetBg > selectedLimits.max)) {
      alert(`Target BG must be between ${selectedLimits.min} and ${selectedLimits.max} ${selectedLimits.unitLabel}.`);
      return;
    }

    if (parsedCorrectionFactor !== null && (isNaN(parsedCorrectionFactor) || parsedCorrectionFactor <= 0 || parsedCorrectionFactor > MAX_CORRECTION_FACTOR)) {
      alert(`Correction factor must be between 0 and ${MAX_CORRECTION_FACTOR}.`);
      return;
    }

    const settingsToSave = { ratio, roundingStep, bgUnit, targetBg, correctionFactor };

    try {
      await storageSet(SETTINGS_STORAGE_KEY, JSON.stringify(settingsToSave));
      alert('Personal settings saved. They will load automatically next time.');
    } catch (error) {
      console.error('Failed to save settings', error);
      alert('Could not save settings. Please try again.');
    }
  };

  const totalCarbsOnPlate = mealPlate.reduce((sum, item) => sum + item.carbs, 0);

  const calculateTotalMealDose = () => {
    const hasMealInput = mealPlate.length > 0;
    const hasCorrectionInput = currentBg !== '' || targetBg !== '' || correctionFactor !== '';

    if (!hasMealInput && !hasCorrectionInput) {
      alert('Add some food or enter BG correction details before calculating.');
      return;
    }

    const insulinRatio = parseFloat(ratio);
    const mealDose = hasMealInput ? totalCarbsOnPlate / insulinRatio : 0;
    let correctionDose = 0;
    let isBelowOrAtTarget = false;

    if (hasMealInput && (isNaN(insulinRatio) || insulinRatio <= 0 || insulinRatio > MAX_RATIO)) {
      alert(`Please enter a valid Insulin-to-Carb Ratio between 1 and ${MAX_RATIO}`);
      return;
    }

    if (hasCorrectionInput) {
      const currentBgValue = parseFloat(currentBg);
      const targetBgValue = parseFloat(targetBg);
      const correctionFactorValue = parseFloat(correctionFactor);
      const selectedLimits = BG_LIMITS[bgUnit];

      if (isNaN(currentBgValue) || isNaN(targetBgValue) || isNaN(correctionFactorValue)) {
        alert('For correction dose, enter valid numbers for current BG, target BG, and correction factor.');
        return;
      }

      if (
        currentBgValue < selectedLimits.min ||
        currentBgValue > selectedLimits.max ||
        targetBgValue < selectedLimits.min ||
        targetBgValue > selectedLimits.max
      ) {
        alert(`BG values must be between ${selectedLimits.min} and ${selectedLimits.max} ${selectedLimits.unitLabel}.`);
        return;
      }

      if (correctionFactorValue <= 0 || correctionFactorValue > MAX_CORRECTION_FACTOR) {
        alert(`Correction factor must be between 0 and ${MAX_CORRECTION_FACTOR}.`);
        return;
      }

      const difference = currentBgValue - targetBgValue;
      isBelowOrAtTarget = difference <= 0;
      correctionDose = isBelowOrAtTarget ? 0 : difference / correctionFactorValue;
    }

    const doseStep = parseFloat(roundingStep);
    const exactDose = mealDose + correctionDose;
    const roundedDose = roundToStep(exactDose, doseStep);
    const finalDoseString = `${roundedDose.toFixed(1)} Units`;

    setCalculatedDose({
      mealDose: mealDose.toFixed(2),
      correctionDose: correctionDose.toFixed(2),
      exactDose: exactDose.toFixed(2),
      roundedDose: roundedDose.toFixed(1),
      step: doseStep,
      correctionUsed: hasCorrectionInput,
      belowOrAtTarget: isBelowOrAtTarget
    });

    const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const entryFoods = mealPlate.map((item) => ({ name: item.name, carbs: item.carbs }));

    setHistory((prevHistory) => [{
      id: Date.now().toString() + Math.random().toString(36).slice(2),
      time: currentTime,
      totalCarbs: totalCarbsOnPlate.toFixed(1),
      dose: finalDoseString,
      mealDose: mealDose.toFixed(1),
      correctionDose: correctionDose.toFixed(1),
      foods: entryFoods
    }, ...prevHistory]);
  };

  const baseLibraryFoods = Object.keys(FOOD_DATABASE).map((key) => ({
    id: key,
    name: FOOD_DATABASE[key].name,
    carbs: FOOD_DATABASE[key].carbs,
    isCustom: false
  }));
  const fullLibraryFoods = [...baseLibraryFoods, ...customLibraryFoods.map((food) => ({ ...food, isCustom: true }))]
    .filter((food) => !hiddenLibraryItemIds.includes(food.id));

  if (!loaded) {
    return (
      <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#6c757d' }}>
        Loading…
      </div>
    );
  }

  return (
    <div style={{ minHeight: '100vh', background: '#f8f9fa', display: 'flex', flexDirection: 'column' }}>
      <div style={{ background: '#fff', padding: '20px 20px 15px', borderBottom: '1px solid #dee2e6', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span style={{ fontSize: 20, fontWeight: 'bold', color: '#1a1a1a' }}>Multi-Select Carb Counter</span>
        <button onClick={() => setHelpModalVisible(true)} style={{ background: 'none', padding: 6, color: '#6c757d', fontWeight: 700, fontSize: 14 }}>
          Help
        </button>
      </div>

      <div style={{ flex: 1, padding: '15px 20px 40px', maxWidth: 640, width: '100%', margin: '0 auto', boxSizing: 'border-box' }}>
        <div style={{ fontSize: 15, fontWeight: 'bold', color: '#495057', marginTop: 10, marginBottom: 8 }}>1. Add Foods to Your Meal Plate:</div>

        <button
          onClick={() => setShowMenu(!showMenu)}
          style={{ width: '100%', background: '#fff', padding: 14, borderRadius: 8, border: '1px solid #dee2e6', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 5 }}
        >
          <span style={{ fontSize: 14, color: '#6c757d', fontWeight: 500 }}>Tap to Open Food Library ({fullLibraryFoods.length} Options)...</span>
          <span style={{ fontSize: 12, color: '#6c757d' }}>{showMenu ? '▲' : '▼'}</span>
        </button>

        {showMenu && (
          <div style={{ background: '#fff', borderRadius: 8, border: '1px solid #dee2e6', marginBottom: 10, height: 280, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
            <div style={{ padding: '8px 10px', borderBottom: '1px solid #f1f3f5', background: '#f8f9fa' }}>
              <span style={{ fontSize: 12, color: '#6c757d', fontWeight: 700 }}>Custom items have a trash button beside them.</span>
            </div>
            <div style={{ flex: 1, overflowY: 'auto' }}>
              {fullLibraryFoods.map((foodItem) => (
                <div key={foodItem.id} style={{ padding: 10, borderBottom: '1px solid #f1f3f5', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                  <button
                    onClick={() => addFoodToPlate(foodItem)}
                    style={{ flex: 1, background: 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'center', textAlign: 'left', padding: 0 }}
                  >
                    <span style={{ fontSize: 14, color: '#212529', flex: 1 }}>{foodItem.name}</span>
                    <span style={{ color: '#6c757d', fontSize: 13, marginRight: 8 }}>{foodItem.carbs}g</span>
                    <span style={{ color: '#007AFF', fontWeight: 'bold', fontSize: 13 }}>[ADD]</span>
                  </button>

                  <button
                    onClick={() => removeFoodFromLibrary(foodItem.id, foodItem.isCustom)}
                    style={{ background: '#dc3545', borderRadius: 8, padding: '8px 10px', minWidth: 76, color: '#fff', fontWeight: 800, fontSize: 12 }}
                  >
                    🗑 Delete
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        <div style={{ background: '#fff', borderRadius: 10, border: '1px solid #dee2e6', padding: 12, marginBottom: 15 }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: '#212529', marginBottom: 8 }}>Add New Food to Library</div>
          <input
            type="text"
            style={{ width: '100%', background: '#fff', padding: 10, borderRadius: 8, fontSize: 14, border: '1px solid #dee2e6', marginBottom: 8 }}
            placeholder="Food name (e.g., Chicken Wrap)"
            value={newLibraryFoodName}
            onChange={(e) => setNewLibraryFoodName(e.target.value)}
          />
          <input
            type="number"
            style={{ width: '100%', background: '#fff', padding: 10, borderRadius: 8, fontSize: 14, border: '1px solid #dee2e6', marginBottom: 10 }}
            placeholder="Carbs per serving (grams only)"
            value={newLibraryFoodCarbs}
            onChange={(e) => setNewLibraryFoodCarbs(e.target.value)}
          />
          <button style={{ width: '100%', background: '#17a2b8', padding: 10, borderRadius: 8, color: '#fff', fontSize: 14, fontWeight: 'bold' }} onClick={addFoodToLibrary}>
            Save to Library
          </button>
        </div>

        <div style={{ background: '#fff', padding: 15, borderRadius: 10, border: '1px solid #dee2e6', marginBottom: 20 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10 }}>
            <span style={{ fontSize: 15, fontWeight: 'bold', color: '#212529' }}>🛒 Your Current Plate Basket:</span>
          </div>

          {mealPlate.length === 0 ? (
            <div style={{ fontStyle: 'italic', color: '#868e96', fontSize: 13, textAlign: 'center', margin: '10px 0' }}>
              Your plate is empty. Add multiple items from the library above!
            </div>
          ) : (
            mealPlate.map((item) => (
              <div key={item.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid #f8f9fa' }}>
                <span style={{ fontSize: 14, color: '#495057', flex: 1 }}>{item.name}</span>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <span style={{ fontSize: 14, fontWeight: 600, color: '#212529' }}>{item.carbs}g</span>
                  <button onClick={() => removeFoodFromPlate(item.id)} style={{ background: 'none', color: '#dc3545', fontWeight: 'bold', fontSize: 12 }}>
                    [REMOVE]
                  </button>
                </div>
              </div>
            ))
          )}

          {mealPlate.length > 0 && (
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 12, paddingTop: 10, borderTop: '2px solid #dee2e6' }}>
              <span style={{ fontSize: 14, fontWeight: 'bold', color: '#212529' }}>Total Combined Carbs:</span>
              <span style={{ fontSize: 16, fontWeight: 'bold', color: '#007AFF' }}>{totalCarbsOnPlate}g</span>
            </div>
          )}
          {mealPlate.length > 0 && (
            <div style={{ textAlign: 'right', marginTop: 12 }}>
              <button onClick={clearPlate} style={{ background: 'none', color: '#dc3545', fontWeight: 600, fontSize: 13 }}>
                Clear Plate
              </button>
            </div>
          )}
        </div>

        <div style={{ marginBottom: 15 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: '#495057', marginBottom: 6 }}>Enter Insulin-to-Carb Ratio (g/Unit):</div>
          <input
            type="number"
            style={{ width: '100%', background: '#fff', padding: 12, borderRadius: 8, fontSize: 16, border: '1px solid #dee2e6' }}
            placeholder="e.g., 10"
            value={ratio}
            onChange={(e) => setRatio(e.target.value)}
          />
        </div>

        <div style={{ marginBottom: 15 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: '#495057', marginBottom: 6 }}>Dose Rounding Step:</div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button
              style={{ background: roundingStep === '0.5' ? '#007AFF' : '#fff', border: '1px solid #dee2e6', borderRadius: 8, padding: '10px 14px', color: roundingStep === '0.5' ? '#fff' : '#212529', fontWeight: 600 }}
              onClick={() => setRoundingStep('0.5')}
            >
              0.5 Unit
            </button>
            <button
              style={{ background: roundingStep === '1' ? '#007AFF' : '#fff', border: '1px solid #dee2e6', borderRadius: 8, padding: '10px 14px', color: roundingStep === '1' ? '#fff' : '#212529', fontWeight: 600 }}
              onClick={() => setRoundingStep('1')}
            >
              1.0 Unit
            </button>
          </div>
        </div>

        <div style={{ background: '#fff', borderRadius: 10, border: '1px solid #dee2e6', padding: 12, marginBottom: 15 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: '#212529' }}>Optional BG Correction Dose</span>
            <button onClick={() => setBgHelpVisible(true)} style={{ background: 'none', padding: 6, color: '#007AFF', fontWeight: 700 }}>?</button>
          </div>

          <div style={{ fontSize: 12, color: '#6c757d', marginBottom: 8 }}>
            BG means Blood Glucose. Enter all fields below only when you need a correction bolus.
          </div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
            <button
              style={{ background: bgUnit === 'mmol' ? '#007AFF' : '#fff', border: '1px solid #dee2e6', borderRadius: 8, padding: '8px 12px', color: bgUnit === 'mmol' ? '#fff' : '#212529', fontWeight: 600 }}
              onClick={() => setBgUnit('mmol')}
            >
              mmol/L
            </button>
            <button
              style={{ background: bgUnit === 'mgdl' ? '#007AFF' : '#fff', border: '1px solid #dee2e6', borderRadius: 8, padding: '8px 12px', color: bgUnit === 'mgdl' ? '#fff' : '#212529', fontWeight: 600 }}
              onClick={() => setBgUnit('mgdl')}
            >
              mg/dL
            </button>
          </div>
          <input
            type="number"
            style={{ width: '100%', background: '#fff', padding: 10, borderRadius: 8, fontSize: 14, border: '1px solid #dee2e6', marginBottom: 8 }}
            placeholder={`Current BG (${BG_LIMITS[bgUnit].unitLabel})`}
            value={currentBg}
            onChange={(e) => setCurrentBg(e.target.value)}
          />
          <input
            type="number"
            style={{ width: '100%', background: '#fff', padding: 10, borderRadius: 8, fontSize: 14, border: '1px solid #dee2e6', marginBottom: 8 }}
            placeholder={`Target BG (${BG_LIMITS[bgUnit].unitLabel})`}
            value={targetBg}
            onChange={(e) => setTargetBg(e.target.value)}
          />
          <input
            type="number"
            style={{ width: '100%', background: '#fff', padding: 10, borderRadius: 8, fontSize: 14, border: '1px solid #dee2e6' }}
            placeholder={`Correction factor (${BG_LIMITS[bgUnit].unitLabel} per 1 unit)`}
            value={correctionFactor}
            onChange={(e) => setCorrectionFactor(e.target.value)}
          />
          <div style={{ fontSize: 11, color: '#6c757d', marginTop: 8, lineHeight: '16px' }}>
            {getCorrectionFactorHelpText(bgUnit)}
          </div>
        </div>

        <button
          style={{ width: '100%', background: '#6f42c1', padding: 12, borderRadius: 8, color: '#fff', fontSize: 14, fontWeight: 'bold', marginBottom: 15 }}
          onClick={savePersonalSettings}
        >
          Save My Personal Settings
        </button>

        <button style={{ width: '100%', background: '#28a745', padding: 14, borderRadius: 8, color: '#fff', fontSize: 16, fontWeight: 'bold', marginTop: 5 }} onClick={calculateTotalMealDose}>
          Calculate Dose
        </button>

        {calculatedDose && (
          <div style={{ marginTop: 20, padding: 15, background: '#e8f0fe', borderRadius: 8, textAlign: 'center' }}>
            <div style={{ fontSize: 14, color: '#185abc' }}>Suggested Combined Dose (rounded to {calculatedDose.step}):</div>
            <div style={{ fontSize: 26, fontWeight: 'bold', color: '#185abc', marginTop: 2 }}>{calculatedDose.roundedDose} Units</div>
            <div style={{ fontSize: 12, color: '#495057', marginTop: 4 }}>Meal dose: {calculatedDose.mealDose} Units</div>
            <div style={{ fontSize: 12, color: '#495057', marginTop: 2 }}>Correction dose: {calculatedDose.correctionDose} Units</div>
            <div style={{ fontSize: 12, color: '#495057', marginTop: 2 }}>Exact total: {calculatedDose.exactDose} Units</div>
            {calculatedDose.correctionUsed && calculatedDose.belowOrAtTarget && (
              <div style={{ fontSize: 12, color: '#b26a00', marginTop: 6 }}>
                Current BG is at or below target. Correction dose was set to 0.
              </div>
            )}
            {parseFloat(calculatedDose.roundedDose) >= HIGH_DOSE_WARNING_UNITS && (
              <div style={{ fontSize: 12, color: '#dc3545', marginTop: 6 }}>
                High-dose result detected. Double-check carbs and ratio before dosing.
              </div>
            )}
          </div>
        )}

        <div style={{ fontSize: 15, fontWeight: 'bold', color: '#495057', marginTop: 20, marginBottom: 10 }}>Today's Historical Logbook:</div>
        <div style={{ marginTop: 5, marginBottom: 40 }}>
          {history.length === 0 ? (
            <div style={{ fontStyle: 'italic', color: '#868e96', fontSize: 13, textAlign: 'center', margin: '10px 0' }}>
              No doses calculated yet.
            </div>
          ) : (
            history.map((entry) => (
              <div key={entry.id} style={{ background: '#fff', padding: 12, borderRadius: 8, marginBottom: 8, border: '1px solid #e9ecef' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                  <span style={{ fontSize: 13, fontWeight: 'bold', color: '#212529' }}>{entry.time}</span>
                  <span style={{ fontSize: 13, color: '#495057' }}>{entry.totalCarbs}g carbs</span>
                </div>
                <div style={{ fontSize: 13, color: '#185abc' }}>Dose: {entry.dose}</div>
                <div style={{ fontSize: 12, color: '#495057', marginTop: 2 }}>
                  Meal {entry.mealDose}u + Correction {entry.correctionDose}u
                </div>

                {entry.foods && entry.foods.length > 0 && (
                  <div style={{ marginTop: 8 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: '#212529' }}>Foods:</div>
                    {entry.foods.map((f, i) => (
                      <div key={i} style={{ fontSize: 12, color: '#495057' }}>• {f.name} — {f.carbs}g</div>
                    ))}
                  </div>
                )}

                <div style={{ marginTop: 8, display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
                  <button onClick={() => removeHistoryEntry(entry.id)} style={{ background: 'none', padding: '6px 10px', color: '#dc3545', fontWeight: 700 }}>
                    Delete
                  </button>
                </div>
              </div>
            ))
          )}
        </div>
      </div>

      {helpModalVisible && (
        <div style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.5)', zIndex: 1000 }} onClick={() => setHelpModalVisible(false)}>
          <div style={{ width: '90%', maxWidth: 480, background: '#fff', borderRadius: 8, padding: 16 }} onClick={(e) => e.stopPropagation()}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 8 }}>Help — Terms</div>
            <p style={{ marginBottom: 6 }}>BG = Blood Glucose level (your current blood sugar reading).</p>
            <p style={{ marginBottom: 6 }}>Insulin-to-Carb Ratio = how many grams of carbs are covered by 1 unit of insulin (e.g., 10 means 1U per 10g carbs).</p>
            <p style={{ marginBottom: 6 }}>Correction factor = how much 1 unit of insulin lowers your blood glucose. Example: a factor of 2 mmol/L per 1 unit means 1 unit should reduce your BG by about 2 mmol/L (or about 35 mg/dL if using mg/dL).</p>
            <p style={{ marginBottom: 6 }}>Meal dose = insulin needed to cover carbs. Correction dose = insulin to bring high BG back toward target.</p>
            <p style={{ marginBottom: 6 }}>Example: if your BG is 12 mmol/L and target is 6 mmol/L, and your factor is 2 mmol/L per 1 unit, the correction is (12 - 6) / 2 = 3 units.</p>
            <div style={{ textAlign: 'right', marginTop: 12 }}>
              <button onClick={() => setHelpModalVisible(false)} style={{ background: 'none', color: '#007AFF', fontWeight: 700 }}>Close</button>
            </div>
          </div>
        </div>
      )}

      {bgHelpVisible && (
        <div style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.5)', zIndex: 1000 }} onClick={() => setBgHelpVisible(false)}>
          <div style={{ width: '90%', maxWidth: 480, background: '#fff', borderRadius: 8, padding: 16 }} onClick={(e) => e.stopPropagation()}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 8 }}>What does BG mean?</div>
            <p style={{ marginBottom: 6 }}>BG stands for Blood Glucose — your current blood sugar measurement. Use the same units your meter shows (mmol/L or mg/dL).</p>
            <p style={{ marginBottom: 6 }}>If your current BG is at or below your chosen target, the correction dose will be set to zero to avoid hypoglycaemia risk.</p>
            <div style={{ textAlign: 'right', marginTop: 12 }}>
              <button onClick={() => setBgHelpVisible(false)} style={{ background: 'none', color: '#007AFF', fontWeight: 700 }}>Close</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
